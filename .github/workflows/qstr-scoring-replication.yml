name: Pinned QSTRBench scoring replication

on:
  push:
    branches: [main]
    paths:
      - "src/qstr_schema_audit.py"
      - "src/qstr_scoring_replication.py"
      - "tests/test_qstr_scoring_replication.py"
      - ".github/workflows/qstr-scoring-replication.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-scoring-replication:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out research code
        uses: actions/checkout@v4
      - name: Validate upstream parser compatibility without network
        run: python3 -m unittest discover -s tests -p 'test_qstr_scoring_replication.py' -v
      - name: Replicate pinned QSTRBench strict scores (aggregate only)
        run: python3 -m src.qstr_scoring_replication
