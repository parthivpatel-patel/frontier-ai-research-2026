name: Protocol 029 independent oracle
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/independent_lasso_oracle.py'
      - 'experiments/run_protocol_029_oracle.py'
      - '.github/workflows/protocol-029-oracle.yml'
permissions:
  contents: read
jobs:
  bounded-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run independent differential check
        run: python -m experiments.run_protocol_029_oracle
