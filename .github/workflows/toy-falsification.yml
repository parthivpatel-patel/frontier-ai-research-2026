name: Toy falsification sanity checks

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "data/external/**"
      - ".github/workflows/toy-falsification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-toy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out research source
        uses: actions/checkout@v4
      - name: Run Python standard-library tests
        run: python3 -m unittest discover -s tests -v
      - name: Print synthetic sanity-check JSON to job log
        run: python3 -m src.toy_falsification --count 256 --seed 20261101
      - name: Print semantic-oracle stress diagnostics
        run: python3 -m src.oracle_stress
      - name: Print two-family semantic-oracle fixtures
        run: python3 -m src.physical_probe_suite
      - name: Print exact intervention distinguishability baseline
        run: python3 -m src.intervention_identifiability
      - name: Audit pinned public NL-to-LTL mutation dataset
        run: python3 -m src.temporal_label_audit
      - name: Run tiny learned NLP baseline and print its limitations
        run: python3 -m src.learned_offset_baseline
      - name: Audit three independent source requirements and exact lasso witnesses
        run: python3 -m src.independent_source_audit
      - name: Filter logical counterexamples through two toy actuator models
        run: python3 -m src.admissible_lasso_audit
      - name: Complete finite-state check for bounded-next toy requirements
        run: python3 -m src.exhaustive_offset_audit
      - name: Audit nested dynamics and masking of counterexamples
        run: python3 -m src.dynamics_masking_audit

      - name: Audit exact disagreement across three nested toy dynamics
        run: python3 -m src.domain_uncertainty_audit

      - name: Audit pinned external NL2MTL JSON structure without redistribution
        run: python3 -m src.nl2mtl_pinned_schema_audit

      - name: Audit alignment-free cardinality bounds from published counts
        run: python3 -m src.alignment_free_bounds

      - name: Enforce source-disjoint split gate on synthetic source IDs
        run: python3 -m src.source_disjoint_gate

      - name: Print hypothetical independent-source precision bounds
        run: python3 -m src.source_precision_gate

      - name: Print synthetic nonzero-failure and multiplicity audit
        run: python3 -m src.selective_risk_gate

      - name: Print synthetic paired unsafe-acceptance audit
        run: python3 -m src.paired_unsafe_acceptance

      - name: Enforce balanced source and trial exposure on synthetic predictions
        run: python3 -m src.balanced_exposure_gate
